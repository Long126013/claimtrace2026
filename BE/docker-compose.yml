services:
  # ------------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Hosts the 14 Relational ERD Tables)
  # ------------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: claimtrace-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimtrace_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimtrace_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-claimtrace_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - claimtrace_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimtrace_admin} -d ${POSTGRES_DB:-claimtrace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - claimtrace-network

  # ------------------------------------------------------------------------------
  # 2. Neo4j Graph Database Service (Hosts the W3C PROV-DM & Claim Evidence Graph)
  # ------------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: claimtrace-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser Web UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Protocol for Backend (Python / Cypher)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-claimtrace_neo4j_password_2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - claimtrace_neo4j_data:/data
      - claimtrace_neo4j_logs:/logs
      - ./init-neo4j:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claimtrace-network

  # ------------------------------------------------------------------------------
  # 3. Lightweight Web Database Manager (Adminer GUI for PostgreSQL)
  # Access at http://localhost:8080
  # ------------------------------------------------------------------------------
  db-manager:
    image: adminer:latest
    container_name: claimtrace-db-manager
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - claimtrace-network

volumes:
  claimtrace_pgdata:
    name: claimtrace_postgres_data
    driver: local
  claimtrace_neo4j_data:
    name: claimtrace_neo4j_data
    driver: local
  claimtrace_neo4j_logs:
    name: claimtrace_neo4j_logs
    driver: local

networks:
  claimtrace-network:
    name: claimtrace-network
    driver: bridge
